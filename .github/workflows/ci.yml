name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run hermetic test suite
        run: pytest -m "not integration" -q
      - name: Guard against an empty collection
        if: always()
        run: |
          count=$(pytest -m "not integration" --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "collected: $count"
          test "$count" -ge 200
